<div class="invite-page">
  <div class="invite-card">
    <h1 class="invite-title">Activate Your Account</h1>

    <div *ngIf="errorMessage && !success" class="alert alert-danger">
      {{ errorMessage }}
    </div>

    <div *ngIf="success" class="alert alert-success">
      Account activated. Redirecting to login...
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="!success">
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" formControlName="password" autocomplete="new-password" />
        <small class="form-text text-muted">At least 8 characters.</small>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" class="form-control" formControlName="confirmPassword" autocomplete="new-password" />
      </div>

      <button type="submit" [disabled]="form.invalid || isLoading" class="btn btn-primary btn-block">
        {{ isLoading ? 'Activating…' : 'Activate Account' }}
      </button>
    </form>
  </div>
</div>
